<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Nemo | Find it. Sort it.</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #ecebe7; --ink: #171717; --quiet: #67655f; --mark: #ff7438; --screen: #141416; }
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
    </style>
  </head>
  <body>
    <main data-hf-id="hf-nemo-root" id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080" data-motion-blur="on" data-motion-blur-shutter="120">
      <div id="stage-background" class="clip" data-start="0" data-duration="18" data-track-index="0" aria-hidden="true" style="position:absolute;inset:0;background:var(--screen);z-index:0"></div>
      <div data-hf-id="hf-nemo-hook-host" id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-nemo-search-host" id="uncertain" data-composition-id="uncertain" data-composition-src="compositions/uncertain.html" data-start="2" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-nemo-reveal-host" id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="5" data-duration="2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-nemo-proof-host" id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="6.967" data-duration="4.033" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-nemo-approval-host" id="approve" data-composition-id="approve" data-composition-src="compositions/approve.html" data-start="11" data-duration="2.5" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-nemo-close-host" id="close" data-composition-id="close" data-composition-src="compositions/close.html" data-start="13.5" data-duration="4.5" data-track-index="5" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio data-hf-id="hf-nemo-music" id="music" class="clip" src="assets/bgm/track.wav" data-start="0" data-duration="18" data-track-index="6" data-volume="1.3" data-fade-in="0.12" data-fade-out="1"></audio>
      <audio data-hf-id="hf-nemo-confirmation-chime" id="confirmation-chime" class="clip" src="assets/sfx/chime.mp3" data-start="11" data-duration="2.5" data-track-index="7" data-volume="0.35"></audio>
      <audio data-hf-id="hf-nemo-end-mark-impact" id="end-mark-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="15" data-duration="2.115906" data-track-index="8" data-volume="0.35"></audio>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
